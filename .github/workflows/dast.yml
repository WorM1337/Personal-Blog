name: DAST - OWASP ZAP

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: Run OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore and build solution
        uses: ./.github/actions/build-n-restore

      - name: Prepare report directory
        run: mkdir -p reports/dast

      - name: Start application
        env:
          ASPNETCORE_URLS: http://127.0.0.1:5000
          Urls: http://127.0.0.1:5000;
          CurrentDatabase: MongoDB
          ConnectionStrings__MongoDB: mongodb://127.0.0.1:27017
          Jwt__Key: demo-insecure-jwt-key-for-security-lab
          Jwt__ExpireHours: 2
          AdminCredentials__Login: admin
          AdminCredentials__Password: admin
        run: |
          dotnet run --no-build --no-launch-profile --project "Personal Blog/Personal Blog.csproj" > reports/dast/app.log 2>&1 &
          echo $! > reports/dast/app.pid

      - name: Wait for application
        run: |
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:5000/html/welcome.html > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become ready in time."
          cat reports/dast/app.log
          exit 1

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:5000/html/welcome.html
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          cmd_options: -a
          fail_action: false
          allow_issue_writing: false
          artifact_name: dast-zap-report

      - name: Show application log on failure
        if: failure()
        run: cat reports/dast/app.log

      - name: Stop application
        if: always()
        run: |
          if [ -f reports/dast/app.pid ]; then
            kill "$(cat reports/dast/app.pid)" || true
          fi

      - name: Upload application log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dast-app-log
          path: reports/dast/app.log
          if-no-files-found: warn
